version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: delhi-traffic-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: delhi_traffic

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: delhi-traffic-backend
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/delhi_traffic
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - /app/node_modules

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: delhi-traffic-ai
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/delhi_traffic
      - BACKEND_URL=http://backend:5000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delhi-traffic-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
